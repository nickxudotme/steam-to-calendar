<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Steam Calendar Logo</title>
  <desc id="desc">A Steam mark segment placed inside a calendar icon.</desc>
  <defs>
    <linearGradient id="frameBlue" x1="169" y1="120" x2="858" y2="930" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4E91E7"/>
      <stop offset="0.48" stop-color="#2D67A8"/>
      <stop offset="1" stop-color="#123252"/>
    </linearGradient>
    <linearGradient id="topBlue" x1="110" y1="120" x2="914" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F96EE"/>
      <stop offset="1" stop-color="#24619E"/>
    </linearGradient>
    <linearGradient id="panelDark" x1="182" y1="294" x2="860" y2="870" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#101B22"/>
      <stop offset="0.55" stop-color="#071014"/>
